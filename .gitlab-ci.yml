image: alpine:latest

variables:
  PROJECT_ID: "123456"                # set in GitLab CI/CD Variables
  BRANCH_NAME: "main"                 # set in GitLab CI/CD Variables
  TRIGGER_TOKEN: $PIPELINE_TRIGGER_TOKEN  # GitLab CI/CD Variable (protected)

pages:
  stage: deploy
  script:
    - apk add --no-cache sed
    # Replace placeholders with actual variables
    - sed -i "s#__PROJECT_ID__#${PROJECT_ID}#g" public/app.js
    - sed -i "s#__BRANCH_NAME__#${BRANCH_NAME}#g" public/app.js
    - sed -i "s#__TRIGGER_TOKEN__#${TRIGGER_TOKEN}#g" public/app.js
  artifacts:
    paths:
      - public
  only:
    - main
