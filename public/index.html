<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab Pipeline Trigger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>GitLab Pipeline Trigger</h1>
        </header>
        <form id="pipeline-form">
            <div id="queries-container">
                <!-- Query cards will be inserted here -->
            </div>
            <button type="button" id="add-query-btn" class="btn btn-add">Add Query</button>
            <button type="submit" id="run-job-btn" class="btn btn-primary">Run Job</button>
        </form>
        <div id="message-container" class="message"></div>
    </main>

    <footer class="site-footer">
        <p>Crafted with ❤️ by Siddharth Mishra</p>
    </footer>

    <!-- Template for a query card -->
    <template id="query-card-template">
        <div class="query-card">
            <button type="button" class="remove-btn">&times;</button>
            <div class="form-group">
                <label>Artifact Name</label>
                <input type="text" class="artifact-name" placeholder="e.g., my-artifact" required>
            </div>
            <div class="form-group">
                <label>Query</label>
                <textarea class="query-text" rows="4" placeholder="e.g., SELECT * FROM my_table" required></textarea>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
